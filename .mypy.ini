[mypy]

# google-api-python-client (googleapiclient) ships no type stubs and no
# py.typed marker, so mypy cannot analyze it. Ignore only this package.
[mypy-googleapiclient.*]
ignore_missing_imports = True

# pyclassifiers ships no py.typed marker, so mypy cannot analyze it even
# though it is installed. Ignore only this package. (Fix upstream by adding
# a py.typed marker to ~/git/pyclassifiers, then drop this stanza.)
[mypy-pyclassifiers.*]
ignore_missing_imports = True

# google-cloud-datastore ships no py.typed marker either, so `from
# google.cloud import datastore` cannot be analyzed. Ignore only this package.
[mypy-google.cloud.*]
ignore_missing_imports = True
