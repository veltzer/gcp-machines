name: build
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install-rsconstruct
      run: |
        curl -fsSL "https://github.com/veltzer/rsconstruct/releases/latest/download/rsconstruct-linux-x86_64" \
          -o /usr/local/bin/rsconstruct
        chmod +x /usr/local/bin/rsconstruct
        rsconstruct version
    - name: install-deps
      run: rsconstruct tools install-deps
    - name: install-tools
      run: rsconstruct tools install
    - name: build
      run: rsconstruct build
    - name: status
      run: rsconstruct status
