<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-label="Servers, a terminal and a cloud">
	<style>
		/* The sign-in page scene: everything animates with plain CSS so the
		   file works as a plain img src. Transforms use fill-box so that
		   rotate/scale happen around each shape's own centre. */
		g, rect, circle, path, ellipse, polygon {
			transform-box: fill-box;
			transform-origin: center;
		}
		.float { animation: float 7s ease-in-out infinite; }
		.float.d1 { animation-delay: -2s; }
		.float.d2 { animation-delay: -4s; }
		.float.d3 { animation-delay: -5.5s; }
		@keyframes float {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-10px); }
		}
		.star { animation: twinkle 3s ease-in-out infinite; }
		.star:nth-child(2n) { animation-delay: -1s; }
		.star:nth-child(3n) { animation-delay: -2s; animation-duration: 4s; }
		.star:nth-child(5n) { animation-delay: -0.5s; animation-duration: 2.5s; }
		@keyframes twinkle {
			0%, 100% { opacity: 0.25; transform: scale(0.8); }
			50% { opacity: 1; transform: scale(1.2); }
		}
		/* drive activity leds: each blinks on its own beat */
		.led { animation: blink 1.6s steps(2, jump-none) infinite; }
		.led:nth-of-type(2n) { animation-duration: 0.9s; }
		.led:nth-of-type(3n) { animation-duration: 2.3s; animation-delay: -0.7s; }
		.led:nth-of-type(5n) { animation-duration: 1.2s; animation-delay: -0.3s; }
		@keyframes blink {
			0% { opacity: 1; }
			100% { opacity: 0.2; }
		}
		.power { animation: glow 2.8s ease-in-out infinite; }
		@keyframes glow {
			0%, 100% { opacity: 0.7; }
			50% { opacity: 1; }
		}
		/* packets running along the cables up to the cloud */
		.packet { animation: travel 3.2s linear infinite; }
		.packet.p2 { animation-delay: -1.1s; }
		.packet.p3 { animation-delay: -2.2s; }
		@keyframes travel {
			0% { transform: translateY(0); opacity: 0; }
			10% { opacity: 1; }
			90% { opacity: 1; }
			100% { transform: translateY(-150px); opacity: 0; }
		}
		.cursor { animation: cursor 1s steps(2, jump-none) infinite; }
		@keyframes cursor {
			0% { opacity: 1; }
			100% { opacity: 0; }
		}
		.type { animation: type 6s steps(24, end) infinite; }
		@keyframes type {
			0% { transform: scaleX(0); }
			50%, 90% { transform: scaleX(1); }
			100% { transform: scaleX(0); }
		}
		.type { transform-origin: left center; }
		.fan { animation: spin 1.4s linear infinite; }
		.fan.slow { animation-duration: 2.6s; }
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		@media (prefers-reduced-motion: reduce) {
			* { animation: none !important; }
		}
	</style>

	<!-- stars -->
	<g fill="#e0e7ff">
		<circle class="star" cx="60" cy="70" r="2"/>
		<circle class="star" cx="140" cy="30" r="1.5"/>
		<circle class="star" cx="520" cy="60" r="2"/>
		<circle class="star" cx="460" cy="130" r="1.5"/>
		<circle class="star" cx="90" cy="190" r="1.5"/>
		<circle class="star" cx="560" cy="230" r="2"/>
		<circle class="star" cx="30" cy="330" r="1.5"/>
		<circle class="star" cx="575" cy="420" r="1.5"/>
		<circle class="star" cx="300" cy="22" r="1.5"/>
		<circle class="star" cx="380" cy="90" r="1"/>
		<circle class="star" cx="210" cy="120" r="1"/>
	</g>

	<!-- the cloud the machines live in -->
	<g class="float d1">
		<path d="M190 250 a52 52 0 0 1 48 -70 a70 70 0 0 1 130 -10 a56 56 0 0 1 72 54 a44 44 0 0 1 -8 88 h-232 a40 40 0 0 1 -10 -62 z" fill="#c7d2fe" opacity="0.95"/>
		<path d="M206 300 h226" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
		<!-- a small gear: compute -->
		<g transform="translate(318 238)">
			<g class="fan slow">
				<circle r="22" fill="#6366f1"/>
				<g fill="#6366f1">
					<rect x="-6" y="-31" width="12" height="14" rx="3"/>
					<rect x="-6" y="17" width="12" height="14" rx="3"/>
					<rect x="-31" y="-6" width="14" height="12" rx="3"/>
					<rect x="17" y="-6" width="14" height="12" rx="3"/>
				</g>
				<circle r="9" fill="#c7d2fe"/>
			</g>
		</g>
	</g>

	<!-- cables from the racks to the cloud, with packets on them -->
	<g stroke="#818cf8" stroke-width="3" fill="none" opacity="0.55" stroke-dasharray="6 8">
		<path d="M175 520 V350"/>
		<path d="M300 520 V350"/>
		<path d="M425 520 V350"/>
	</g>
	<g fill="#f472b6">
		<circle class="packet" cx="175" cy="510" r="5"/>
		<circle class="packet p2" cx="300" cy="510" r="5"/>
		<circle class="packet p3" cx="425" cy="510" r="5"/>
	</g>

	<!-- three server racks -->
	<g class="float d2">
		<g transform="translate(115 520)">
			<rect width="120" height="250" rx="14" fill="#1e293b" stroke="#334155" stroke-width="3"/>
			<g fill="#334155">
				<rect x="12" y="16" width="96" height="34" rx="6"/>
				<rect x="12" y="60" width="96" height="34" rx="6"/>
				<rect x="12" y="104" width="96" height="34" rx="6"/>
				<rect x="12" y="148" width="96" height="34" rx="6"/>
			</g>
			<g fill="#475569">
				<rect x="22" y="29" width="48" height="8" rx="3"/>
				<rect x="22" y="73" width="48" height="8" rx="3"/>
				<rect x="22" y="117" width="48" height="8" rx="3"/>
				<rect x="22" y="161" width="48" height="8" rx="3"/>
			</g>
			<g>
				<circle class="led" cx="84" cy="33" r="4" fill="#34d399"/>
				<circle class="led" cx="96" cy="33" r="4" fill="#60a5fa"/>
				<circle class="led" cx="84" cy="77" r="4" fill="#34d399"/>
				<circle class="led" cx="96" cy="77" r="4" fill="#fbbf24"/>
				<circle class="led" cx="84" cy="121" r="4" fill="#34d399"/>
				<circle class="led" cx="96" cy="121" r="4" fill="#60a5fa"/>
				<circle class="led" cx="84" cy="165" r="4" fill="#34d399"/>
				<circle class="led" cx="96" cy="165" r="4" fill="#60a5fa"/>
			</g>
			<g transform="translate(60 216)">
				<circle r="20" fill="#0f172a"/>
				<g class="fan" fill="#64748b">
					<ellipse cx="0" cy="-9" rx="5" ry="9"/>
					<ellipse cx="9" cy="0" rx="9" ry="5"/>
					<ellipse cx="0" cy="9" rx="5" ry="9"/>
					<ellipse cx="-9" cy="0" rx="9" ry="5"/>
				</g>
				<circle r="4" fill="#94a3b8"/>
			</g>
		</g>
	</g>

	<g class="float d3">
		<g transform="translate(240 500)">
			<rect width="120" height="280" rx="14" fill="#1e293b" stroke="#334155" stroke-width="3"/>
			<g fill="#334155">
				<rect x="12" y="16" width="96" height="34" rx="6"/>
				<rect x="12" y="60" width="96" height="34" rx="6"/>
				<rect x="12" y="104" width="96" height="34" rx="6"/>
				<rect x="12" y="148" width="96" height="34" rx="6"/>
				<rect x="12" y="192" width="96" height="34" rx="6"/>
			</g>
			<g fill="#475569">
				<rect x="22" y="29" width="48" height="8" rx="3"/>
				<rect x="22" y="73" width="48" height="8" rx="3"/>
				<rect x="22" y="117" width="48" height="8" rx="3"/>
				<rect x="22" y="161" width="48" height="8" rx="3"/>
				<rect x="22" y="205" width="48" height="8" rx="3"/>
			</g>
			<g>
				<circle class="led" cx="84" cy="33" r="4" fill="#60a5fa"/>
				<circle class="led" cx="96" cy="33" r="4" fill="#34d399"/>
				<circle class="led" cx="84" cy="77" r="4" fill="#34d399"/>
				<circle class="led" cx="96" cy="77" r="4" fill="#34d399"/>
				<circle class="led" cx="84" cy="121" r="4" fill="#fbbf24"/>
				<circle class="led" cx="96" cy="121" r="4" fill="#34d399"/>
				<circle class="led" cx="84" cy="165" r="4" fill="#34d399"/>
				<circle class="led" cx="96" cy="165" r="4" fill="#60a5fa"/>
				<circle class="led" cx="84" cy="209" r="4" fill="#60a5fa"/>
				<circle class="led" cx="96" cy="209" r="4" fill="#34d399"/>
			</g>
			<!-- power button -->
			<g transform="translate(60 254)">
				<circle r="14" fill="#0f172a"/>
				<path class="power" d="M0 -8 v7 M-6 -4 a8 8 0 1 0 12 0" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
			</g>
		</g>
	</g>

	<g class="float">
		<g transform="translate(365 520)">
			<rect width="120" height="250" rx="14" fill="#1e293b" stroke="#334155" stroke-width="3"/>
			<g fill="#334155">
				<rect x="12" y="16" width="96" height="34" rx="6"/>
				<rect x="12" y="60" width="96" height="34" rx="6"/>
				<rect x="12" y="104" width="96" height="34" rx="6"/>
				<rect x="12" y="148" width="96" height="34" rx="6"/>
			</g>
			<g fill="#475569">
				<rect x="22" y="29" width="48" height="8" rx="3"/>
				<rect x="22" y="73" width="48" height="8" rx="3"/>
				<rect x="22" y="117" width="48" height="8" rx="3"/>
				<rect x="22" y="161" width="48" height="8" rx="3"/>
			</g>
			<g>
				<circle class="led" cx="84" cy="33" r="4" fill="#34d399"/>
				<circle class="led" cx="96" cy="33" r="4" fill="#34d399"/>
				<circle class="led" cx="84" cy="77" r="4" fill="#60a5fa"/>
				<circle class="led" cx="96" cy="77" r="4" fill="#34d399"/>
				<circle class="led" cx="84" cy="121" r="4" fill="#34d399"/>
				<circle class="led" cx="96" cy="121" r="4" fill="#fbbf24"/>
				<circle class="led" cx="84" cy="165" r="4" fill="#60a5fa"/>
				<circle class="led" cx="96" cy="165" r="4" fill="#34d399"/>
			</g>
			<g transform="translate(60 216)">
				<circle r="20" fill="#0f172a"/>
				<g class="fan slow" fill="#64748b">
					<ellipse cx="0" cy="-9" rx="5" ry="9"/>
					<ellipse cx="9" cy="0" rx="9" ry="5"/>
					<ellipse cx="0" cy="9" rx="5" ry="9"/>
					<ellipse cx="-9" cy="0" rx="9" ry="5"/>
				</g>
				<circle r="4" fill="#94a3b8"/>
			</g>
		</g>
	</g>

	<!-- a terminal window floating in front, typing a command -->
	<g class="float d1">
		<g transform="translate(330 390)">
			<rect width="230" height="120" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
			<rect width="230" height="26" rx="12" fill="#1e293b"/>
			<rect y="14" width="230" height="12" fill="#1e293b"/>
			<circle cx="16" cy="13" r="5" fill="#f87171"/>
			<circle cx="32" cy="13" r="5" fill="#fbbf24"/>
			<circle cx="48" cy="13" r="5" fill="#34d399"/>
			<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
				<text x="14" y="52" fill="#34d399">$</text>
				<rect class="type" x="28" y="42" width="150" height="12" rx="3" fill="#a5b4fc"/>
				<text x="14" y="78" fill="#34d399">$</text>
				<rect x="28" y="68" width="92" height="12" rx="3" fill="#64748b"/>
				<text x="14" y="104" fill="#34d399">$</text>
				<rect class="cursor" x="28" y="93" width="9" height="15" fill="#e0e7ff"/>
			</g>
		</g>
	</g>

	<!-- floor glow -->
	<ellipse cx="300" cy="830" rx="250" ry="26" fill="#6366f1" opacity="0.18"/>
</svg>
