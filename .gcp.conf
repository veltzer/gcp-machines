gcp_configuration_name=machines

# Which identity google.auth should use in this repo:
#   default   -> your personal account (GOOGLE_APPLICATION_CREDENTIALS unset)
#   <name>    -> a service account (see gcp_sa_<name> in prompt_gcp docs)
#
# This project is administered as the project owner (your default account).
# The service account exists only for the deployed app, which gets its identity
# from GCP automatically (no local key), so we never use an SA key locally.
gcp_identity=default

# Where and how the app is deployed by gcloud_run_deploy.sh (utils-bash).
# Keep service/region in sync with SERVICE/REGION in scripts/iap.py.
gcp_service=machines
gcp_region=us-central1
# The identity the deployed app runs as (created by scripts/service_account.py).
gcp_service_account=machines-app-sa@veltzer-machines-id.iam.gserviceaccount.com
# Admins see and control every machine; students see only the machine whose
# owner label maps to their email in Datastore (pushed by scripts/iap.py sync).
#
# Optional shared secret protecting the app before IAP is enabled: append
# ",ACCESS_TOKEN=<long random string>" to the env vars and hand students the
# link https://<service-url>/?token=<the value>. Once IAP is on the token is
# redundant and should stay unset.
gcp_run_args=(
	--no-allow-unauthenticated
	--service-account "${gcp_service_account}"
	--max-instances 2
	--set-env-vars ADMIN_EMAILS=mark.veltzer@gmail.com
)
