gcp_configuration_name=machines

# Which identity google.auth should use in this repo:
#   default   -> your personal account (GOOGLE_APPLICATION_CREDENTIALS unset)
#   <name>    -> a service account (see gcp_sa_<name> in prompt_gcp docs)
#
# This project is administered as the project owner (your default account).
# The service account exists only for the deployed app, which gets its identity
# from GCP automatically (no local key), so we never use an SA key locally.
gcp_identity=default

# Where and how the app is deployed by gcloud_deploy.sh (utils-bash).
# Keep service/region in sync with SERVICE/REGION in scripts/iap.py.
gcp_service=machines
gcp_region=us-central1
# The identity the deployed app runs as (created by scripts/service_account.py).
gcp_service_account=machines-app-sa@veltzer-machines-id.iam.gserviceaccount.com
# Custom domain (Cloud Run domain mapping, CNAME at Cloudflare, see
# doc/deploy.md). The app redirects the run.app hostnames to it, so it is the
# only origin the sign-in providers need to know.
gcp_domain=machines.veltzer.org

# OAuth client IDs for the sign-in buttons; not secret. Each one is created
# by hand (see doc/deploy.md) and pasted here; an empty one hides its button.
# The Google client's secret is unused (ID tokens are verified with the
# client ID alone) but kept in pass:keys/google.com.machines-oauth.
gcp_oauth_client_id=57950378250-erbtgbuap3s1vfu4eibjjg8o78aa2s3l.apps.googleusercontent.com
gcp_github_client_id=

# Admins see and control every machine; everyone else sees only the machine
# their account maps to (see doc/deploy.md). Only a listed email that is
# verified counts as admin: a Google or GitHub sign-in, or a password account
# whose mailed link was followed while signed in to it.
gcp_admin_emails=mark.veltzer@gmail.com

# ─── one-time setup (gcloud_project_setup.sh) ────────────────────────────────

gcp_service_account_roles=(
	roles/secretmanager.secretAccessor
	roles/identitytoolkit.admin
)
# The session cookie signing key, generated once. The GitHub client secret is
# added here (pass:keys/github.com.machines-oauth) together with
# gcp_github_client_id when the GitHub OAuth app exists.
gcp_secrets=(
	"${gcp_service}-secret-key=random:hex:32"
)

# ─── deploy (gcloud_deploy.sh) ───────────────────────────────────────────────

# The app does its own sign-in (Google, GitHub, email and password), so the
# service is public; IAP is off (doc/iap.md is the history of that setup).
gcp_run_args=(
	--allow-unauthenticated
	--service-account "${gcp_service_account}"
	--max-instances 2
	--set-env-vars "ADMIN_EMAILS=${gcp_admin_emails},CANONICAL_HOST=${gcp_domain},GOOGLE_CLIENT_ID=${gcp_oauth_client_id},GITHUB_CLIENT_ID=${gcp_github_client_id}"
	--set-secrets "SECRET_KEY=${gcp_service}-secret-key:latest"
)
