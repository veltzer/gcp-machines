[project]
name = "gcp-machines"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "google-api-python-client",
    "google-cloud-datastore",
    "gunicorn",
    "markupsafe",
    "pyclassifiers",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
search-path = [
    "src",
    "scripts",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "google.*",
    "googleapiclient.*",
]
