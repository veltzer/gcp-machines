[project]
name = "gcp-machines"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "google-api-python-client",
    "google-auth",
    "google-cloud-datastore",
    # per-thread connections for the API clients (src/main.py api_http)
    "google-auth-httplib2",
    "httplib2",
    "gunicorn",
    "markupsafe",
    # ed25519 ssh key pairs for new machines (src/provision.py)
    "cryptography",
    "pyclassifiers",
    "requests",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-httplib2",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    "src",
    "scripts",
    ".",
]
# Third-party libraries without type information.
ignore-missing-imports = [
    "google.*",
    "googleapiclient.*",
]

[tool.pyrefly.errors]
no-any-return = "error"

[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
