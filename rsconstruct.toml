# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
src_dirs = ["tera.templates"]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]

[processor.ruff]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.pylint]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.mypy]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.pytest]
src_dirs = ["tests"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["doc"]
src_files = ["README.md"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.hadolint]
src_files = ["Dockerfile"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.ijsonlint]
src_dirs = [".claude"]
src_files = ["package.json"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["src/static"]
