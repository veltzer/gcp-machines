# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[build]

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
src_dirs = ["tera.templates"]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.pylint]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.mypy]
src_dirs = ["src", "scripts", "config", "tests"]

[processor.requirements]
src_dirs = ["src", "scripts", "config", "tests"]
# `from google.cloud import datastore` lives in a different distribution than
# the rest of the google namespace package. Import scanning only sees the
# top-level `google`, which resolves to google-api-python-client, so the
# datastore distribution has to be declared explicitly or CI installs a
# requirements.txt that cannot satisfy the import.
extra = ["google-cloud-datastore"]

[processor.pytest]
src_dirs = ["tests"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

[processor.eslint]
src_dirs = ["config"]
args = ["-c", "config/eslint.config.js"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# Runtime deps so CI installs what the code imports (pylint/mypy resolve them).
# Same pattern as demos-cloud-aws; replaces the workflow's hand-run
# `pip install -r requirements.txt` -- install-deps installs these instead.
# google-cloud-datastore is also in [processor.requirements] extra above, for
# the same namespace-package reason documented there.
[dependencies]
pip = [
    "flask",
    "google-api-python-client",
    "google-cloud-datastore",
    "markupsafe",
    "pyclassifiers",
]
